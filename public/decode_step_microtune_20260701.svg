<svg xmlns="http://www.w3.org/2000/svg" width="1512" height="936" viewBox="0 0 1512 936" role="img" aria-labelledby="title desc">
  <title id="title">Gemma 4 12B decode-step microtune on RTX A6000</title>
  <desc id="desc">Short decode-step p50 TPOT changed from 37.869 milliseconds before tuning to 37.682 milliseconds after tuning, saving 0.187 milliseconds per token.</desc>
  <rect width="1512" height="936" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#000000">
    <text x="756" y="97" text-anchor="middle" font-size="30">Gemma 4 12B Decode-Step Microtune on RTX A6000</text>
    <g stroke="#b0b0b0" stroke-opacity="0.35" stroke-width="1">
      <line x1="151" y1="730" x2="1482" y2="730"/>
      <line x1="151" y1="618" x2="1482" y2="618"/>
      <line x1="151" y1="506" x2="1482" y2="506"/>
      <line x1="151" y1="394" x2="1482" y2="394"/>
      <line x1="151" y1="282" x2="1482" y2="282"/>
      <line x1="151" y1="170" x2="1482" y2="170"/>
    </g>
    <g stroke="#000000" stroke-width="2">
      <line x1="151" y1="112" x2="151" y2="730"/>
      <line x1="151" y1="730" x2="1482" y2="730"/>
    </g>
    <g font-size="27" text-anchor="end">
      <text x="134" y="740">37.5</text>
      <text x="134" y="628">37.6</text>
      <text x="134" y="516">37.7</text>
      <text x="134" y="404">37.8</text>
      <text x="134" y="292">37.9</text>
      <text x="134" y="180">38.0</text>
    </g>
    <text x="85" y="421" transform="rotate(-90 85 421)" text-anchor="middle" font-size="27">p50 TPOT ms/token</text>
    <rect x="405" y="317" width="273" height="413" fill="#4c78a8"/>
    <rect x="834" y="526" width="273" height="204" fill="#54a24b"/>
    <g font-size="26" text-anchor="middle">
      <text x="542" y="285">37.869 ms</text>
      <text x="542" y="314">26.407 tok/s</text>
      <text x="971" y="494">37.682 ms</text>
      <text x="971" y="523">26.538 tok/s</text>
    </g>
    <g font-size="28" text-anchor="middle">
      <text x="542" y="768">Before microtune</text>
      <text x="971" y="768">After microtune</text>
    </g>
    <g font-size="24" text-anchor="middle">
      <text x="756" y="820">Saved 0.187 ms/token, about 0.49%. Lower is better.</text>
    </g>
    <g font-size="22" text-anchor="middle">
      <text x="756" y="878">Shape: prompt "Hello", prompt length 1, decode-step mode, 2 warmups, 4 timed iterations, 3 samples.</text>
      <text x="756" y="902">Axis is zoomed to show the microtune; wider 5-sample run moved 39.054 ms to 38.874 ms p50.</text>
    </g>
  </g>
</svg>
