<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Decode-step microtune before and after</title>
  <desc id="desc">A short decode-step benchmark moved from 37.869 milliseconds before tuning to 37.682 milliseconds after tuning, saving 0.187 milliseconds per token.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #d6dde8; stroke-width: 1; }
    .title { fill: #0f172a; font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle { fill: #475569; font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #1e293b; font: 600 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #0f172a; font: 700 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .axis { fill: #64748b; font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .callout { fill: #166534; font: 700 26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .note { fill: #475569; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
  </style>
  <rect class="bg" width="960" height="520"/>
  <rect class="panel" x="32" y="28" width="896" height="464" rx="8"/>
  <text class="title" x="64" y="76">Decode-step microtune</text>
  <text class="subtitle" x="64" y="105">Short p50 TPOT benchmark • prompt “Hello” • lower is better</text>
  <text class="axis" x="84" y="144">Zoomed y-axis: 37.5-38.0 ms</text>
  <line class="grid" x1="162" y1="150" x2="620" y2="150"/>
  <line class="grid" x1="162" y1="215" x2="620" y2="215"/>
  <line class="grid" x1="162" y1="280" x2="620" y2="280"/>
  <line class="grid" x1="162" y1="345" x2="620" y2="345"/>
  <line class="grid" x1="162" y1="410" x2="620" y2="410"/>
  <text class="axis" x="104" y="154">38.0</text>
  <text class="axis" x="104" y="219">37.875</text>
  <text class="axis" x="104" y="284">37.75</text>
  <text class="axis" x="104" y="349">37.625</text>
  <text class="axis" x="104" y="414">37.5</text>
  <rect x="250" y="218" width="110" height="192" rx="4" fill="#2563eb"/>
  <rect x="430" y="315" width="110" height="95" rx="4" fill="#16a34a"/>
  <text class="label" x="230" y="446">Before</text>
  <text class="label" x="420" y="446">After</text>
  <text class="value" x="238" y="205">37.869 ms</text>
  <text class="value" x="421" y="302">37.682 ms</text>
  <path d="M670 226 L805 226" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <path d="M805 226 L784 212 M805 226 L784 240" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <text class="callout" x="674" y="186">-0.187 ms/token</text>
  <text class="value" x="674" y="266">26.407 → 26.538 tok/s</text>
  <text class="note" x="674" y="300">+0.131 tok/s, about 0.49%</text>
  <text class="note" x="64" y="466">Wider final run was noisier: 39.054 ms → 38.874 ms p50, same ~0.18 ms/token scale.</text>
</svg>
